# Dependabot : propose chaque semaine des pull requests de mise à jour
# pour les dépendances npm (Astro…) et les actions GitHub épinglées.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
