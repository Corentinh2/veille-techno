name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Aucun droit par défaut : chaque job ne reçoit que ce dont il a besoin.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Le build exécute du code tiers (dépendances npm) : lecture seule uniquement.
    permissions:
      contents: read
    steps:
      # Actions épinglées par empreinte (SHA) : une étiquette peut être déplacée,
      # une empreinte non. Version lisible en commentaire.
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Configurer GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site (avec contrôle de sécurité du contenu)
        run: npm run build
        env:
          # URL et sous-chemin déduits automatiquement du dépôt,
          # ex. https://pseudo.github.io et /veille-techno
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
          ASTRO_TELEMETRY_DISABLED: 1

      - name: Publier l'artefact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Seul ce job, qui n'exécute aucun code du dépôt, peut publier le site.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
